[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
; Datenbankverwaltung über die Weboberfläche abschalten (keine DB-Liste, kein Master-Passwort nötig)
list_db = False
; Bei großen Importen (viele Anhänge) großzügigere Limits
limit_time_cpu = 600
limit_time_real = 1200
limit_request = 65536
