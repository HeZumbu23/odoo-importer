# Minimaler IMAP-Server für Archiv-/Staging-Postfächer.
# Läuft ohne TLS im internen Docker-Netz; Port nach außen nur für Tests/imapsync freigeben.
protocols = imap
listen = *
log_path = /dev/stderr
info_log_path = /dev/stdout

ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login

mail_location = maildir:/srv/mail/%u/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/srv/mail/%u
}

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
}

protocol imap {
  mail_max_userip_connections = 50
}
